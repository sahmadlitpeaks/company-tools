# Local development overrides — Vite HMR + backend auto-reload.
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#
# Then open http://localhost:5173  (not :8080 — that is the production nginx image)
#
# Or keep API in Docker and run Vite on the host (fastest on Windows):
#
#   docker compose up -d db backend
#   cd frontend && npm run dev
#   → http://localhost:5173

services:
  backend:
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - media:/data/media
      - backups:/data/backups
    environment:
      # Allow the Vite dev origin (and the prod-style nginx port if you use both).
      BACKEND_CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,http://localhost:8080
      FRONTEND_BASE_URL: http://localhost:5173
      PUBLIC_BASE_URL: http://localhost:5173
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  # Replace the nginx production frontend with Vite's dev server.
  frontend:
    image: node:24-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      # Keep container node_modules separate from the host (avoids OS binary mismatches).
      - frontend_node_modules:/app/node_modules
    environment:
      # From inside the compose network, hit the backend service by name.
      VITE_API_PROXY_TARGET: http://backend:8000
    ports:
      - "5173:5173"
    # Drop the production 8080:80 mapping by not declaring it here when this file
    # is used alone with the base file: Compose merges ports, so we also publish
    # 5173. Prefer opening :5173 for HMR. Use only host Vite if you want a single port.
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 5173"
    depends_on:
      - backend

volumes:
  frontend_node_modules:
